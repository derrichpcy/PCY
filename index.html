<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0A1F3D">
    <title>PCY · Seafood Catalog</title>

    <link rel="preconnect" href="https://wa.me">
    <link rel="dns-prefetch" href="https://wa.me">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0A1F3D;
            --primary-light: #1A3A6B;
            --primary-soft: #E8EEF7;
            --accent: #FF6B35;
            --accent-hover: #E85A24;
            --success: #16A34A;
            --whatsapp: #25D366;
            --whatsapp-hover: #1EBE57;
            --bg: #FAFAF7;
            --bg-elevated: #FFFFFF;
            --text: #0F172A;
            --text-muted: #64748B;
            --text-soft: #94A3B8;
            --border: #E5E7EB;
            --border-soft: #F1F5F9;
            --danger: #DC2626;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 10px 30px rgba(15, 23, 42, 0.10);
            --shadow-xl: 0 20px 50px rgba(15, 23, 42, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 100px;
        }

        *:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        /* ============ HEADER (with sticky search) ============ */
        .app-header {
            background: var(--primary);
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.7rem 1.25rem;
            max-width: 1280px;
            margin: 0 auto;
        }

        .brand {
            font-size: 1.15rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.01em;
        }

        .icon-btn {
            position: relative;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.12);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-1px);
        }

        .icon-btn svg { width: 20px; height: 20px; }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--primary);
        }

        .cart-badge.visible { display: flex; animation: pop 0.3s ease; }

        @keyframes pop {
            0% { transform: scale(0); }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .header-search {
            padding: 0 1.25rem 0.85rem;
            max-width: 1280px;
            margin: 0 auto;
        }

        .search-bar {
            background: white;
            border-radius: 10px;
            padding: 0.4rem 0.5rem 0.4rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .search-bar svg {
            width: 18px;
            height: 18px;
            color: var(--text-soft);
            flex-shrink: 0;
        }

        .search-bar input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.95rem;
            color: var(--text);
            font-family: inherit;
            padding: 0.45rem 0;
            min-width: 0;
        }

        .search-bar input::placeholder { color: var(--text-soft); }

        .search-clear {
            background: var(--border-soft);
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .search-clear:hover { background: var(--border); }
        .search-clear.visible { display: flex; }

        /* ============ CATEGORY TABS (rectangular, sticky) ============ */
        .category-nav {
            background: white;
            padding: 0.7rem 0;
            position: sticky;
            top: 105px;
            z-index: 90;
            border-bottom: 1px solid var(--border-soft);
        }

        .category-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0 1.25rem;
            max-width: 1280px;
            margin: 0 auto;
            scrollbar-width: none;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .category-scroll::-webkit-scrollbar { display: none; }

        .cat-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
            scroll-snap-align: start;
            font-family: inherit;
        }

        .cat-btn:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .cat-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .cat-icon { font-size: 1rem; line-height: 1; }

        .cat-count {
            background: rgba(0,0,0,0.06);
            color: var(--text-muted);
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 6px;
            font-weight: 700;
        }

        .cat-btn.active .cat-count {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        /* ============ RESULTS BAR ============ */
        .results-bar {
            max-width: 1280px;
            margin: 1rem auto 0.25rem;
            padding: 0 1.25rem;
        }

        .results-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .results-count strong { color: var(--text); font-weight: 700; }

        /* ============ GRID ============ */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.9rem;
            padding: 0.75rem 1.25rem 1.5rem;
            max-width: 1280px;
            margin: 0 auto;
        }

        @media (min-width: 640px) {
            .product-grid { grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        }

        @media (min-width: 900px) {
            .product-grid { grid-template-columns: repeat(4, 1fr); }
        }

        @media (min-width: 1200px) {
            .product-grid { grid-template-columns: repeat(5, 1fr); }
        }

        /* ============ PRODUCT CARD ============ */
        .product-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
            position: relative;
        }

        .product-card:hover {
            border-color: var(--border);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .product-card.in-cart {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255, 107, 53, 0.1);
        }

        .product-card.in-cart::after {
            content: 'In Order';
            position: absolute;
            top: 0.6rem;
            left: 0.6rem;
            background: var(--accent);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: linear-gradient(135deg, #F8FAFC 0%, #EEF2F7 100%);
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .product-card:hover .product-img { transform: scale(1.05); }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .product-info {
            padding: 0.7rem 0.85rem 0.85rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-category {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.25rem;
        }

        .product-name {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.35;
            margin-bottom: 0.6rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.2em;
        }

        .product-name .highlight {
            background: #FEF3C7;
            color: var(--text);
            border-radius: 3px;
            padding: 0 2px;
            font-weight: 700;
        }

        .card-controls {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Stepper with built-in KG unit */
        .stepper {
            display: flex;
            align-items: stretch;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }

        .stepper-btn {
            background: transparent;
            border: none;
            width: 34px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background 0.1s;
        }

        .stepper-btn:hover { background: var(--bg); }
        .stepper-btn:active { background: var(--primary-soft); }

        .stepper-value {
            flex: 1;
            display: flex;
            align-items: center;
            border-left: 1.5px solid var(--border);
            border-right: 1.5px solid var(--border);
            background: white;
            min-width: 0;
        }

        .stepper-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 0.5rem 0.25rem 0.5rem 0.5rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text);
            min-width: 0;
            font-family: inherit;
            text-align: left;
            -moz-appearance: textfield;
        }

        .stepper-input::-webkit-outer-spin-button,
        .stepper-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .stepper-unit {
            padding: 0 0.7rem 0 0.2rem;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            user-select: none;
            letter-spacing: 0.04em;
        }

        /* Size row */
        .size-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .size-input {
            flex: 1;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 0.4rem 0.6rem;
            font-size: 0.75rem;
            font-family: inherit;
            color: var(--text);
            background: white;
            outline: none;
            min-width: 0;
        }

        .size-input:focus { border-color: var(--primary); }
        .size-input::placeholder { color: var(--text-soft); }
        .size-input.hidden { display: none; }

        .size-toggle {
            background: none;
            border: 1.5px dashed var(--border);
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.4rem 0.55rem;
            border-radius: 8px;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.15s;
        }

        .size-toggle:hover { color: var(--primary); border-color: var(--primary); }
        .size-toggle.active { display: none; }

        /* Add button */
        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 0.5rem;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            transition: all 0.15s;
        }

        .add-btn:hover { background: var(--primary-light); }
        .add-btn:active { transform: scale(0.98); }
        .add-btn.added { background: var(--success) !important; }
        .add-btn svg { width: 14px; height: 14px; }

        /* ============ SECTION HEADERS ============ */
        .section-header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.75rem 0 0.25rem;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .section-header .cat-icon { font-size: 1.2rem; }
        .section-header span {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 500;
            margin-left: auto;
        }

        /* ============ EMPTY STATE ============ */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
        }

        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 0.75rem; opacity: 0.5; }
        .empty-state h3 { font-size: 1rem; font-weight: 700; margin-bottom: 0.25rem; }
        .empty-state p { font-size: 0.85rem; color: var(--text-muted); }

        /* ============ BOTTOM ORDER BAR ============ */
        .order-bar {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            max-width: 540px;
            margin: 0 auto;
            background: var(--primary);
            color: white;
            border-radius: 14px;
            padding: 0.7rem 0.75rem 0.7rem 1.1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            z-index: 95;
            transform: translateY(180%);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-xl);
        }

        .order-bar.visible { transform: translateY(0); }

        .order-bar-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
        }

        .order-bar-info .bag-icon {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.15);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .order-bar-info .bag-icon svg { width: 18px; height: 18px; }

        .order-bar-info .bag-icon::after {
            content: attr(data-count);
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .order-bar-text { line-height: 1.2; }
        .order-bar-text strong { display: block; font-size: 0.9rem; font-weight: 700; }
        .order-bar-text small { font-size: 0.7rem; color: rgba(255,255,255,0.7); }

        .order-bar-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.7rem 1.1rem;
            border-radius: 9px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.15s;
            white-space: nowrap;
        }

        .order-bar-btn:hover { background: var(--accent-hover); }
        .order-bar-btn svg { width: 14px; height: 14px; }

        /* ============ CART DRAWER ============ */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            justify-content: flex-end;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .cart-overlay.active { opacity: 1; pointer-events: auto; }

        .cart-drawer {
            background: var(--bg-elevated);
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-xl);
        }

        .cart-overlay.active .cart-drawer { transform: translateX(0); }

        .cart-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .cart-header-title { display: flex; flex-direction: column; gap: 0.15rem; }

        .cart-header-title h2 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .cart-header-title small { font-size: 0.75rem; color: var(--text-muted); }

        .close-cart {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.15s;
        }

        .close-cart:hover { background: var(--border-soft); }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem 1.25rem;
        }

        .cart-empty {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .cart-empty .empty-icon { font-size: 3.5rem; margin-bottom: 1rem; opacity: 0.4; }
        .cart-empty h3 { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 0.4rem; }
        .cart-empty p { font-size: 0.85rem; margin-bottom: 1.25rem; }
        .cart-empty button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .cart-item {
            background: white;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 0.85rem;
            margin-bottom: 0.65rem;
            transition: border-color 0.15s;
        }

        .cart-item:hover { border-color: var(--border); }

        .cart-item-top {
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .cart-item-img {
            width: 54px;
            height: 54px;
            object-fit: cover;
            border-radius: 9px;
            background: var(--bg);
            flex-shrink: 0;
        }

        .cart-item-details { flex-grow: 1; min-width: 0; }

        .cart-item-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
            margin-bottom: 0.3rem;
        }

        .cart-item-meta {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--text-soft);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.25rem 0.4rem;
            border-radius: 6px;
            transition: all 0.15s;
            font-family: inherit;
            white-space: nowrap;
        }

        .remove-btn:hover { color: var(--danger); background: #FEF2F2; }

        .cart-item-inputs {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 0.6rem;
            align-items: end;
        }

        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }

        .input-group label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .input-group input {
            padding: 0.5rem 0.65rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            color: var(--text);
            background: white;
            outline: none;
            width: 100%;
        }

        .input-group input:focus { border-color: var(--primary); }

        .cart-footer {
            padding: 1.25rem 1.5rem 1.5rem;
            border-top: 1px solid var(--border-soft);
            background: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.3rem; }

        .form-group label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-group input {
            padding: 0.6rem 0.7rem;

        function getCategoryCount(cat) {
            if (cat === "Semua") return products.length;
            return products.filter(p => p.category === cat).length;
        }

        let saveTimeout;
        function saveCart() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('pcy_cart', JSON.stringify({ items: cart, savedAt: new Date().toISOString() }));
            }, 150);
        }

        function loadCart() {
            const savedCompany = localStorage.getItem('pcy_company');
            const savedDate = localStorage.getItem('pcy_delivery_date');

            const raw = localStorage.getItem('pcy_cart');
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        cart = parsed;
                    } else if (parsed.items && parsed.savedAt) {
                        const hoursOld = (Date.now() - new Date(parsed.savedAt)) / 3600000;
                        if (hoursOld > 6) {
                            localStorage.removeItem('pcy_cart');
                            cart = [];
                        } else {
                            cart = parsed.items;
                        }
                    }
                } catch (e) { cart = []; }
            }
            if (savedCompany) document.getElementById('companyNameInput').value = savedCompany;
            if (savedDate) document.getElementById('deliveryDateInput').value = savedDate;
        }

        function persistForm() {
            localStorage.setItem('pcy_company', document.getElementById('companyNameInput').value);
            localStorage.setItem('pcy_delivery_date', document.getElementById('deliveryDateInput').value);
        }

        function handleSearchInput() {
            const input = document.getElementById("searchInput");
            const clearBtn = document.getElementById("searchClear");
            clearBtn.classList.toggle("visible", input.value.length > 0);
            filterProducts();
        }

        function clearSearch() {
            const input = document.getElementById("searchInput");
            input.value = "";
            document.getElementById("searchClear").classList.remove("visible");
            input.focus();
            filterProducts();
        }

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('deliveryDateInput').setAttribute('min', today);

            loadCart();
            renderTabs();
            filterProducts();
            updateCartBadge();

            document.getElementById('companyNameInput').addEventListener('input', persistForm);
            document.getElementById('deliveryDateInput').addEventListener('change', persistForm);
        });

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function renderTabs() {
            const tabsContainer = document.getElementById("categoryTabs");
            tabsContainer.innerHTML = categories.map((cat) => {
                const count = getCategoryCount(cat);
                const icon = categoryIcons[cat] || "";
                return `<button class="cat-btn ${cat === currentCategory ? 'active' : ''}" 
                            onclick="setCategory('${cat}')"
                            role="tab" 
                            aria-selected="${cat === currentCategory}">
                        <span class="cat-icon" aria-hidden="true">${icon}</span>
                        ${cat}
                        <span class="cat-count">${count}</span>
                    </button>`;
            }).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderTabs();
            setTimeout(() => {
                const activeBtn = document.querySelector('.cat-btn.active');
                if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }, 10);
            filterProducts();
        }

        function updateResultsCount(count) {
            const countEl = document.getElementById("resultsCount");
            if (!countEl) return;
            const query = document.getElementById("searchInput").value.trim();

            if (query) {
                countEl.innerHTML = `<strong>${count}</strong> result${count !== 1 ? 's' : ''} for "${query}"`;
            } else {
                countEl.innerHTML = `<strong>${count}</strong> item${count !== 1 ? 's' : ''} in ${currentCategory === 'Semua' ? 'catalog' : currentCategory}`;
            }
        }

        function isInCart(productId) {
            return cart.some(item => item.id === productId);
        }

        function createProductCard(p, query) {
            const card = document.createElement('div');
            card.className = "product-card" + (isInCart(p.id) ? " in-cart" : "");
            const displayName = highlightText(p.name, query);
            const inCart = isInCart(p.id);

            card.innerHTML = `
                <div class="img-wrap">
                    <img src="${p.imgUrl}" alt="${p.name}" class="product-img" loading="lazy" width="400" height="400" onerror="this.onerror=null; this.src='${fallbackImg}'; this.parentElement.style.background='#e5e3da';">
                </div>
                <div class="product-info">
                    <span class="product-category">${p.category}</span>
                    <h3 class="product-name">${displayName}</h3>
                    <div class="card-controls">
                        <button type="button" class="size-toggle" data-id="${p.id}" onclick="toggleSizeField(${p.id}, this)">+ Size</button>
                        <input type="text" class="size-input hidden" id="size-${p.id}" placeholder="Size / grade (e.g. 300/500)">
                        <div class="stepper" aria-label="Weight in kilograms">
                            <button type="button" class="stepper-btn" onclick="adjustWeight(${p.id}, -5)" aria-label="Decrease">−</button>
                            <div class="stepper-value">
                                <input type="number" class="stepper-input" id="weight-${p.id}" value="5" min="5" step="1" oninput="clampWeight(${p.id})" aria-label="Weight">
                                <span class="stepper-unit">KG</span>
                            </div>
                            <button type="button" class="stepper-btn" onclick="adjustWeight(${p.id}, 5)" aria-label="Increase">+</button>
                        </div>
                        <button class="add-btn ${inCart ? 'added' : ''}" onclick="addToOrder(${p.id}, this)">
                            ${inCart ? '<svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Added' : '<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add to Order'}
                        </button>
                    </div>
                </div>
            `;
            return card;
        }

        function filterProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();

            const filtered = products.filter(p => {
                const matchCategory = currentCategory === "Semua" || p.category === currentCategory;
                if (!query) return matchCategory;
                // Search the visible name AND the hidden keywords array
                const inName = p.name.toLowerCase().includes(query);
                const inKeywords = (p.keywords || []).some(k => k.toLowerCase().includes(query));
                return matchCategory && (inName || inKeywords);
            });

            const grid = document.getElementById("productGrid");
            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h3>No matches found</h3>
                        <p>Try a different keyword or category</p>
                    </div>`;
                updateResultsCount(0);
                return;
            }

            updateResultsCount(filtered.length);

            if (currentCategory === "Semua") {
                categories.slice(1).forEach(cat => {
                    const catProducts = filtered.filter(p => p.category === cat);
                    if (catProducts.length === 0) return;

                    const icon = categoryIcons[cat] || "";
                    const header = document.createElement('div');
                    header.className = 'section-header';
                    header.innerHTML = `<span class="cat-icon">${icon}</span> ${cat} <span>${catProducts.length} item${catProducts.length !== 1 ? 's' : ''}</span>`;
                    grid.appendChild(header);

                    catProducts.forEach(p => grid.appendChild(createProductCard(p, query)));
                });
            } else {
                filtered.forEach(p => grid.appendChild(createProductCard(p, query)));
            }
        }

        function adjustWeight(productId, delta) {
            const input = document.getElementById(`weight-${productId}`);
            let val = parseFloat(input.value) || 5;
            val += delta;
            if (val < 5) val = 5;
            input.value = val;
        }

        function clampWeight(productId) {
            const input = document.getElementById(`weight-${productId}`);
            let val = parseFloat(input.value);
            if (isNaN(val) || val < 5) {
                // allow empty while typing — only force min on blur
                if (input.value !== "" && val < 5) input.value = 5;
                if (input.value === "") input.value = 5;
            }
        }

        function toggleSizeField(productId, btnElement) {
            const sizeInput = document.getElementById(`size-${productId}`);
            if (sizeInput.classList.contains('hidden')) {
                sizeInput.classList.remove('hidden');
                btnElement.classList.add('active');
                sizeInput.focus();
            } else {
                sizeInput.classList.add('hidden');
                btnElement.classList.remove('active');
                sizeInput.value = "";
            }
        }

        function addToOrder(productId, buttonElement) {
            const product = products.find(p => p.id === productId);
            const sizeInput = document.getElementById(`size-${productId}`);
            const weightInput = document.getElementById(`weight-${productId}`);

            const size = sizeInput ? sizeInput.value.trim() : "";
            const weight = weightInput ? parseFloat(weightInput.value) || 5 : 5;

            const existing = cart.find(item => item.id === productId && item.size === size);

            if (existing) {
                existing.weight += weight;
            } else {
                cart.push({
                    cartUniqueId: Date.now() + Math.random(),
                    id: product.id,
                    name: product.name,
                    imgUrl: product.imgUrl,
                    size: size,
                    weight: weight
                });
            }

            saveCart();

            const card = buttonElement.closest('.product-card');
            if (card) card.classList.add('in-cart');
            buttonElement.classList.add('added');
            buttonElement.innerHTML = '<svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Added';

            updateCartBadge();

            setTimeout(() => {
                if (!isInCart(productId) || existing) {
                    buttonElement.classList.remove('added');
                    buttonElement.innerHTML = '<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add to Order';
                }
            }, 1500);

            if (weightInput) weightInput.value = "5";
            if (sizeInput) {
                sizeInput.value = "";
                sizeInput.classList.add('hidden');
                const toggleBtn = sizeInput.previousElementSibling;
                if (toggleBtn && toggleBtn.classList.contains('size-toggle')) {
                    toggleBtn.classList.remove('active');
                }
            }
        }

        function updateCartBadge() {
            const badge = document.getElementById("cartBadge");
            const headerCount = document.getElementById("cartItemCountHeader");

            if (cart.length > 0) {
                badge.classList.add('visible');
                badge.textContent = cart.length;
                headerCount.textContent = `${cart.length} item${cart.length > 1 ? 's' : ''} added`;
            } else {
                badge.classList.remove('visible');
                headerCount.textContent = '0 items added';
            }
            updateOrderBar();
        }

        function updateOrderBar() {
            const bar = document.getElementById("orderBar");
            const countEl = document.getElementById("orderBarCount");
            const weightEl = document.getElementById("orderBarWeight");
            const iconEl = document.getElementById("orderBarIcon");

            if (cart.length === 0) {
                bar.classList.remove("visible");
                return;
            }

            const totalKg = cart.reduce((sum, item) => sum + (parseFloat(item.weight) || 0), 0);
            countEl.textContent = `${cart.length} item${cart.length > 1 ? 's' : ''}`;
            weightEl.textContent = `${totalKg.toFixed(1)} KG total`;
            iconEl.setAttribute('data-count', cart.length);
            bar.classList.add("visible");
        }

        let lastFocusedElement = null;

        function trapFocus(element) {
            const focusable = element.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])');
            const firstFocusable = focusable[0];
            const lastFocusable = focusable[focusable.length - 1];

            element.addEventListener('keydown', function(e) {
                if (e.key !== 'Tab') return;
                if (e.shiftKey) {
                    if (document.activeElement === firstFocusable) {
                        e.preventDefault();
                        lastFocusable.focus();
                    }
                } else {
                    if (document.activeElement === lastFocusable) {
                        e.preventDefault();
                        firstFocusable.focus();
                    }
                }
            });
        }

        function toggleCart() {
            const overlay = document.getElementById("cartOverlay");
            const isOpening = !overlay.classList.contains("active");

            overlay.classList.toggle("active");
            document.body.style.overflow = isOpening ? 'hidden' : '';

            if (isOpening) {
                lastFocusedElement = document.activeElement;
                renderCartItems();
                setTimeout(() => {
                    const closeBtn = document.querySelector('.close-cart');
                    if (closeBtn) closeBtn.focus();
                    trapFocus(overlay);
                }, 100);
            } else {
                if (lastFocusedElement) lastFocusedElement.focus();
            }
        }

        function closeCartOnOutsideClick(e) {
            if (e.target.id === "cartOverlay") toggleCart();
        }

        function renderCartItems() {
            const container = document.getElementById("cartItemsContainer");
            container.innerHTML = "";

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <div class="empty-icon">🛒</div>
                        <h3>Your order list is empty</h3>
                        <p>Browse the catalog and tap "Add to Order" on the items you need.</p>
                        <button onclick="toggleCart()">Browse Seafood</button>
                    </div>`;
                document.getElementById("cartTotalKg").textContent = "0 KG";
                return;
            }

            let totalKg = 0;

            cart.forEach((item) => {
                totalKg += parseFloat(item.weight) || 0;
                const el = document.createElement("div");
                el.className = "cart-item";
                const sizeBadge = item.size ? `<span class="cart-item-meta">Size: ${item.size}</span>` : '';
                el.innerHTML = `
                    <div class="cart-item-top">
                        <img src="${item.imgUrl}" alt="${item.name}" class="cart-item-img" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImg}'; this.style.background='#e5e3da';">
                        <div class="cart-item-details">
                            <div class="cart-item-name">${item.name}</div>
                            ${sizeBadge}
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${item.cartUniqueId})">Remove</button>
                    </div>
                    <div class="cart-item-inputs">
                        <div class="input-group">
                            <label>Size</label>
                            <input type="text" placeholder="e.g. 300/500" value="${item.size}" 
                                   oninput="updateCartItemData(${item.cartUniqueId}, 'size', this.value)">
                        </div>
                        <div class="input-group">
                            <label>Weight</label>
                            <div class="stepper">
                                <button type="button" class="stepper-btn" onclick="adjustCartWeight(${item.cartUniqueId}, -5, this)" aria-label="Decrease">−</button>
                                <div class="stepper-value">
                                    <input type="number" class="stepper-input" value="${item.weight}" min="1" step="0.1" oninput="updateCartWeight(${item.cartUniqueId}, this.value)" aria-label="Weight">
                                    <span class="stepper-unit">KG</span>
                                </div>
                                <button type="button" class="stepper-btn" onclick="adjustCartWeight(${item.cartUniqueId}, 5, this)" aria-label="Increase">+</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });

            document.getElementById("cartTotalKg").textContent = `${totalKg.toFixed(1)} KG`;
        }

        function updateCartItemData(cartUniqueId, field, value) {
            const item = cart.find(i => i.cartUniqueId === cartUniqueId);
            if (item) {
                item[field] = value;
                saveCart();
            }
        }

        function updateCartWeight(cartUniqueId, value) {
            const item = cart.find(i => i.cartUniqueId === cartUniqueId);
            if (!item) return;
            const v = parseFloat(value);
            item.weight = isNaN(v) ? 5 : Math.max(0, v);
            saveCart();
            // Recompute footer total only
            const totalKg = cart.reduce((sum, it) => sum + (parseFloat(it.weight) || 0), 0);
            document.getElementById("cartTotalKg").textContent = `${totalKg.toFixed(1)} KG`;
            updateOrderBar();
        }

        function adjustCartWeight(cartUniqueId, delta) {
            const item = cart.find(i => i.cartUniqueId === cartUniqueId);
            if (!item) return;
            let val = (parseFloat(item.weight) || 5) + delta;
            if (val < 1) val = 1;
            item.weight = val;
            saveCart();
            renderCartItems();
            updateOrderBar();
        }

        function removeFromCart(cartUniqueId) {
            cart = cart.filter(item => item.cartUniqueId !== cartUniqueId);
            saveCart();
            renderCartItems();
            updateCartBadge();
            filterProducts();
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert("Please add at least one item before sending.");
                return;
            }

            const companyName = document.getElementById("companyNameInput").value.trim();
            const deliveryDate = document.getElementById("deliveryDateInput").value.trim();

            if (!companyName) {
                alert("Please enter your company name.");
                document.getElementById("companyNameInput").focus();
                return;
            }

            if (!deliveryDate) {
                alert("Please select a delivery date.");
                document.getElementById("deliveryDateInput").focus();
                return;
            }

            const totalKg = cart.reduce((sum, item) => sum + (parseFloat(item.weight) || 0), 0);

            let message = `Hello PCY! 👋\n\n`;
            message += `*Company:* ${companyName}\n`;
            message += `*Delivery Date:* ${deliveryDate}\n\n`;
            message += `*Order List:*\n`;

            cart.forEach((item, idx) => {
                const itemSize = item.size.trim() === "" ? "" : ` (${item.size.trim()})`;
                const itemWeight = item.weight || 5;
                message += `${idx + 1}. ${item.name}${itemSize} — ${itemWeight} KG\n`;
            });

            message += `\n*Total: ${cart.length} item${cart.length > 1 ? 's' : ''} · ${totalKg.toFixed(1)} KG*`;
            message += `\n\nPlease confirm availability and pricing. Thank you!`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;

            window.open(whatsappUrl, "_blank");
        }
    </script>
</body>
</html>
